name: Build AMR

# PiliPRO —— 有道词典笔 Falcon mini-app (全量重构版)
#
# 存储策略 (私有仓库 Actions 配额紧张):
#   - 产物 retention-days: 7 (2 天会导致"构建成功但已过期", 无法取回真机验证)
#   - 同名产物只保留最新 3 份 (Prune 步骤)
#   - 同分支并发构建自动取消
#   - 分支: pilipro = PiliPRO (appid 8009476000000001)
on:
  push:
    branches: [pilipro]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    # ubuntu-22.04: GCC 11.4 (GLIBCXX_3.4.29) + glibc 2.35,
    # 低于设备 libstdc++/libc 上限, 产物可直接加载
    # (ubuntu-latest = 24.04 的 GCC13/glibc2.38 会超设备运行时版本)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 静态门禁放最前面: 零依赖、最省时间, 能把"语法/资源/绑定"类错误挡在交叉编译之前.
      - name: Setup Node.js 24 (静态门禁)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Static checks
        run: |
          node tools/validate.mjs
          node --import ./tools/globals.mjs --import ./tools/register-stub.mjs tools/check-design.mjs
          node --import ./tools/globals.mjs --import ./tools/register-stub.mjs tools/check-core.mjs

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            make \
          && sudo rm -rf /var/lib/apt/lists/*

      - name: Cross-compile libjsapi_bilinet.so (aarch64)
        run: |
          cmake -B build/native \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            native/bilinet
          cmake --build build/native --config Release --parallel $(nproc)
          mkdir -p libs
          cp -f build/native/libjsapi_bilinet.so libs/libjsapi_bilinet.so
          file libs/libjsapi_bilinet.so
          aarch64-linux-gnu-readelf -h libs/libjsapi_bilinet.so | grep -E 'Class|Machine'

      - name: Strip native artifacts
        run: |
          # Release 构建带 -g, .debug 段能占 .so 的 90%+.
          # --strip-debug 只删调试段, 保留 .dynsym -> 模块加载不受影响.
          aarch64-linux-gnu-strip --strip-debug libs/libjsapi_bilinet.so
          # 红线: 导出符号没了模块就加载不起来, 必须命中
          aarch64-linux-gnu-nm -D libs/libjsapi_bilinet.so | grep -q custom_init_jsapis
          ls -l libs/

      # 打包链路 (aiot-cli -> webpack-dev-server -> spdy -> process.binding http_parser)
      # 在 Node 22 上会崩 (http_parser 已移除), 所以打包必须退回 Node 18;
      # 静态门禁要 node:sqlite 之类的新 API 又必须 22.5+, 两段各用各的版本.
      - name: Setup Node.js 18 (打包链路)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps + Build AMR (production quickjs)
        run: |
          npm install -g pnpm@10.12.4
          pnpm install
          pnpm run package

      - name: Collect AMR
        run: find . -name '*.amr' -type f -exec ls -l {} \;

      # 红线自检: 原生模块没进包 = 应用启动即崩 (真机表现为白屏 + 无日志).
      # 这条断言把"白屏"挡在出包之前, 是成本最低的一道闸.
      - name: Verify AMR contains native module
        run: |
          set -euo pipefail
          amr=$(ls -1 ./*.amr | head -n1)
          echo "AMR: $amr"
          unzip -l "$amr"
          # .so 与 manifest 都必须存在
          unzip -l "$amr" | grep -q 'libjsapi_bilinet.so' || { echo "::error::AMR 缺少 libjsapi_bilinet.so —— 装到设备上必然白屏"; exit 1; }
          unzip -l "$amr" | grep -q 'manifest.json' || { echo "::error::AMR 缺少 manifest.json"; exit 1; }
          # emoji 字体必须随包 (设置页的"安装表情字体"要读它)
          unzip -l "$amr" | grep -q 'Twemoji.ttf' || { echo "::error::AMR 缺少 libs/Twemoji.ttf"; exit 1; }
          # manifest 的版本与 appid 必须与 package.json 一致 (防止打包器缓存旧值)
          unzip -p "$amr" manifest.json | python3 -c "import json,sys; m=json.load(sys.stdin); p=json.load(open('package.json')); assert m['appid']==p['appid'], 'appid 不一致'; print('appid OK:', m['appid']); print('version:', m['version'])"
          echo "原生模块与 manifest 校验通过"

      - name: Upload AMR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilipro-amr
          path: ./*.amr
          if-no-files-found: error
          retention-days: 7

      - name: Prune old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ids=$(gh api "/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                  --jq '.artifacts | group_by(.name) | map(sort_by(.created_at) | reverse | .[3:]) | flatten | .[].id' || true)
          for id in $ids; do
            gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/$id" \
              && echo "pruned artifact $id" || echo "prune failed: $id"
          done
